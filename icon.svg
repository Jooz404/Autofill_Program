<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b5c"/>
      <stop offset="100%" stop-color="#e30613"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#0054a6"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e22e"/>
      <stop offset="100%" stop-color="#8dc63f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Main outer shell -->
  <rect x="12" y="12" width="104" height="104" rx="28" fill="#1b1e23" stroke="#2d3139" stroke-width="4"/>
  
  <!-- Outer glowing loop representing automation -->
  <path d="M 64,24 A 40,40 0 1,1 24,64" fill="none" stroke="url(#gradBlue)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 64,104 A 40,40 0 0,1 104,64" fill="none" stroke="url(#gradGreen)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 104,64 A 40,40 0 0,1 64,24" fill="none" stroke="url(#gradRed)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Inner Automation Gear aspect -->
  <circle cx="64" cy="64" r="22" fill="#14171a" stroke="#fff" stroke-width="1.5" />
  
  <!-- Direct play symbol to show command/autofill execution -->
  <polygon points="56,50 80,64 56,78" fill="url(#gradGreen)" filter="url(#glow)"/>
</svg>
